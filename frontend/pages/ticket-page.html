<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Detail</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <a href="../index.html" class="topbar-brand">Ticketing App</a>
        </header>

        <main>
            <a href="../index.html" class="back-link">← Back to tickets</a>
            <p id="detailStatus" class="status-message" aria-live="polite">Loading ticket...</p>

            <article id="ticketContent" class="ticket-card hidden">
                <h1 id="ticketTitle" class="ticket-title"></h1>

                <section class="description-section">
                    <h2 class="section-label">Description</h2>
                    <div id="ticketDescription" class="description-box"></div>
                </section>

                <section class="meta-grid">
                    <div class="meta-item">
                        <span>Owner</span>
                        <strong id="ticketOwner">-</strong>
                    </div>
                    <div class="meta-item">
                        <span>Status</span>
                        <strong id="ticketStatus">-</strong>
                    </div>
                    <div class="meta-item">
                        <span>Priority</span>
                        <strong id="ticketPriority">-</strong>
                    </div>
                    <div class="meta-item">
                        <span>Created at</span>
                        <strong id="ticketCreatedAt">-</strong>
                    </div>
                    <div class="meta-item">
                        <span>Updated at</span>
                        <strong id="ticketUpdatedAt">-</strong>
                    </div>
                </section>
            </article>
        </main>
    </div>

    <script src="../api.js"></script>
    <script src="ticket-page.js"></script>
</body>
</html>
